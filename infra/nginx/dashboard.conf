# nginx for the dashboard SPA plus an /api/ reverse proxy to cp-api.
#
# Serving both from one origin is the point: no CORS configuration, no
# environment-specific base URL in the client, and the same relative fetch
# paths work in dev (via Vite's proxy) and in production.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # --- SPA -------------------------------------------------------------
    # try_files falls back to index.html so a deep link or a refresh is handled
    # by the client router rather than 404-ing on a path with no file behind it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading the old
    # bundle after a deploy and references asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Docker's embedded DNS. Required for the runtime resolution below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API proxy -------------------------------------------------------
    # `proxy_pass` with a literal hostname is resolved ONCE, at config load,
    # and cached for the life of the worker. That silently breaks the dashboard
    # whenever cp-api is recreated (`docker compose up -d cp-api`) and comes
    # back on a different IP: nginx keeps dialling the old address and every
    # /api/ request 502s until the dashboard itself is restarted. Observed, not
    # theoretical -- it is how drill F started out already broken.
    #
    # Putting the upstream in a VARIABLE forces re-resolution per request,
    # honouring the 10s TTL above.
    #
    # The catch: once proxy_pass contains a variable, nginx stops appending the
    # matched URI automatically, so $request_uri must be added explicitly.
    # Without it every request would arrive at the backend as "/". This is the
    # same trap as the trailing slash -- and note there is deliberately NO
    # trailing slash here either, since $request_uri already carries the full
    # original path including the /api prefix the routes expect.
    set $cp_api_upstream "cp-api:8000";

    location /api/ {
        proxy_pass http://$cp_api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propagated so an API log line can be tied back to a browser request.
        proxy_set_header X-Request-ID      $request_id;

        # Comfortably above the /overview endpoint's own 6s fan-out budget, so
        # nginx never times out a request the API was about to answer.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # The API is the one that decides what a dependency failure looks like
        # (200 with a degradation envelope). nginx must not replace that with
        # its own error page, or the dashboard would lose the reason.
        proxy_intercept_errors off;
    }

    # Liveness and readiness live at the API root, not under /api.
    location ~ ^/(healthz|readyz|docs|openapi\.json)$ {
        proxy_pass http://$cp_api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # The dashboard container's own liveness, answered without touching cp-api.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

; Alembic configuration.
;
; Note there is no sqlalchemy.url here, and that is deliberate: the database URL
; is resolved in migrations/env.py from app.config.Settings, so .env stays the
; single source of truth and credentials are never committed to this file.
;
; Usage (from control_plane/):
;   alembic upgrade head
;   alembic downgrade base
;   alembic revision --autogenerate -m "describe change"
;
; Running from your host rather than inside Compose? Point at the published
; port, since the defaults are container-network names:
;   POSTGRES_HOST=localhost POSTGRES_PORT=5433 alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

; Revision filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s

; No post_write_hooks. A formatter hook here makes `alembic revision` fail
; outright when the tool is missing from the interpreter running Alembic
; (ruff ships as a standalone binary with no console_scripts entrypoint, so
; the usual recipe does not even resolve). Generated revisions are formatted
; by `make fmt`, which covers the whole repository and falls back to uvx.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

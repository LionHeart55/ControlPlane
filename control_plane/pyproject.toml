[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milvus-control-plane"
version = "0.1.0"
description = "Control plane for Milvus 2.6: deployment automation, health, observability."
# No `readme` key on purpose: the Docker build context is control_plane/, so a
# "../README.md" reference resolves outside the context and the image build
# fails with a confusing packaging error.
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- web tier ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",

    # --- persistence ---
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",

    # --- outbound adapters ---
    # pymilvus 3.x exists and targets a different server generation; the <2.7
    # cap is load-bearing, not cosmetic. Resolves to 2.6.x for a 2.6 server.
    "pymilvus>=2.6,<2.7",
    "docker>=7.1,<8",
    "httpx>=0.27,<1",
    "prometheus-client>=0.21,<1",

    # --- scheduling ---
    # APScheduler 4.x is alpha-only and replaces the AsyncIOScheduler API this
    # project is built on. Pin below 4 deliberately.
    "apscheduler>=3.11,<4",

    # --- support ---
    "structlog>=24.4",
    "cachetools>=5.5",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27,<1",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Optional: integration tests that spin up their own throwaway containers.
# Not required by `make test`.
testcontainers = ["testcontainers>=4.8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async — catches blocking calls in async defs
    "RUF",   # ruff-specific
]
ignore = [
    "B008", # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
exclude = ["migrations/versions"]

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "pymilvus.*",
    "docker.*",
    "apscheduler.*",
    "cachetools.*",
    "prometheus_client.*",
    "grpc",
    "grpc.*",
    # Optional extra for `ops/milvus_demo.py --embedder minilm`. Not installed
    # by default, so it must not fail the typecheck on a clean checkout.
    "sentence_transformers.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
markers = [
    "integration: requires a running stack (deselect with -m 'not integration')",
    "destructive: stops and restarts containers; restores them afterwards",
]
